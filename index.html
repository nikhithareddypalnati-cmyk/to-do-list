<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header>
        <div>
            <p class="small-title">MY PRODUCTIVITY</p>
            <h1>To-Do List</h1>
        </div>

        <div class="task-count">
            <span id="totalTasks">0</span>
            <small>Tasks</small>
        </div>
    </header>


    <!-- ADD TASK -->

    <div class="add-card">

        <input
            type="text"
            id="taskInput"
            placeholder="What do you need to do?"
        >

        <div class="task-details">

            <select id="priority">
                <option value="Low">Low Priority</option>
                <option value="Medium" selected>Medium Priority</option>
                <option value="High">High Priority</option>
            </select>

            <input type="date" id="taskDate">

            <input type="time" id="taskTime">

            <button onclick="addTask()">+ Add Task</button>

        </div>

    </div>


    <!-- SEARCH -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search tasks..."
            oninput="displayTasks()"
        >

    </div>


    <!-- FILTERS -->

    <div class="filters">

        <button class="filter active" onclick="setFilter('all', this)">
            All
        </button>

        <button class="filter" onclick="setFilter('pending', this)">
            Pending
        </button>

        <button class="filter" onclick="setFilter('completed', this)">
            Completed
        </button>

    </div>


    <!-- TASK LIST -->

    <div id="taskList"></div>


    <!-- EMPTY MESSAGE -->

    <div id="emptyMessage">
        <div class="empty-icon">✓</div>
        <h2>No tasks yet</h2>
        <p>Add a task above to get started.</p>
    </div>


    <!-- CLEAR COMPLETED -->

    <button class="clear-btn" onclick="clearCompleted()">
        Clear Completed Tasks
    </button>

</div>


<!-- EDIT POPUP -->

<div id="editPopup" class="popup">

    <div class="popup-content">

        <h2>Edit Task</h2>

        <input type="text" id="editInput">

        <div class="edit-buttons">

            <button onclick="saveEdit()">Save</button>

            <button onclick="closeEdit()" class="cancel">
                Cancel
            </button>

        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
